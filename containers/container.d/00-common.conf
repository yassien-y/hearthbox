
[Container]
ContainerName=%N
Volume=/etc/localtime:/etc/localtime:ro
UserNS=keep-id
User=%U
Group=%G
Label=glance.icon=sh:%N

[Service]
# This host's values, written by Install (INTERNAL_DOMAIN, ...), usable as ${VAR} in every unit file
EnvironmentFile=%h/appdata/.env
# Podman won't create missing bind-mount folders: this unit's own, before it starts
ExecStartPre=/bin/sh %h/repo/scripts/containers/create-folders.sh %N
Restart=on-failure
# systemd's default, 100ms, uses up its 5 starts in 10 seconds before anything that
# isn't ready yet (the network, another service) can change
RestartSec=1s

[Install]
WantedBy=default.target
