# The resolver that finds each $backend's container: rendered from
# templates/resolver.conf.template
include /tmp/resolver.conf;

# Every site's certificate: each name in the map below, signed by this host's CA
# (renew-cert.sh, which re-signs it when the map changes)
ssl_certificate     /certs/services.crt;
ssl_certificate_key /certs/services.key;

# One map for every service: <name> -> <container>:<the port it listens on>
# To add a service: add a line here. Reserved names, never a service's: nbs and hs (the
# NetBird and Headscale servers' public addresses in internet mode) and ca (the CA's root
# certificate, below).
map $sub $backend {
    ollama       ollama:8099;
    photos       immich:8098;
    home         glance:8097;
    jellyfin     jellyfin:8096;
    sonarr       sonarr:8095;
    prowlarr     prowlarr:8094;
    qbittorrent  qbittorrent:8093;
    radarr       radarr:8092;
    lidarr       lidarr:8091;
    listenarr    listenarr:8090;
    search       searxng:8089;
    netbird      netbird-dashboard:8080;
}

# The CA's root certificate, over plain HTTP: devices download it before they trust the
# HTTPS sites. Only the certificate, never the CA's key.
server {
    listen 8080;
    server_name ~^ca\.;
    location = /root.crt {
        root /certs;
    }
    location / {
        return 404;
    }
}

# Every other plain HTTP request goes to HTTPS
server {
    listen 8080 default_server;
    return 301 https://$host$request_uri;
}

# Per-service overrides: must come BEFORE the general block
# (when two regex server_names match, the first one wins).
server {
    listen 8443 ssl;
    server_name ~^(?<sub>qbittorrent)(\..+)?$;
    client_max_body_size 10m;
    include conf.d/site.inc;
}

# Immich: photos and videos of any size. nginx's default stops uploads at 1 MB.
server {
    listen 8443 ssl;
    server_name ~^(?<sub>photos)(\..+)?$;
    client_max_body_size 0;
    include conf.d/site.inc;
}

# Ollama streams its answers a few words at a time: pass each on as it comes, instead of
# holding it in nginx's buffer
server {
    listen 8443 ssl;
    server_name ~^(?<sub>ollama)(\..+)?$;
    proxy_buffering off;
    include conf.d/site.inc;
}

# All other services
server {
    listen 8443 ssl;
    server_name ~^(?<sub>[a-z0-9-]+)(\..+)?$;
    include conf.d/site.inc;
}

# Anything that doesn't match
server {
    listen 8443 ssl default_server;
    server_name _;
    return 404;
}
